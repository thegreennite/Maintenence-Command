name = "fhg-command-api"
main = "worker/index.js"
compatibility_date = "2026-08-28"

[[d1_databases]]
binding = "DB"
database_name = "fhg-command-db"
database_id = "96ae85a7-61f5-493e-847b-51a17aa39465"
migrations_dir = "migrations"

# Control-plane database: the registry of every company using Inspect N Snap
# Command (the "clients" table) plus the email->company directory login
# uses to find the right company database before a session exists. Each
# company's actual app data (users, buildings, inspections, everything)
# lives in ITS OWN separate D1 database, never in this one -- see
# worker/tenant-db.js. Forest Hill Group is the one exception that gets
# to use the fast native "DB" binding above directly instead of the HTTP
# API path every other (future) company uses, since it's already wired
# in as a real binding.
[[d1_databases]]
binding = "CONTROL_DB"
database_name = "power-log-command-control"
database_id = "f321a737-e02b-490a-a5b0-61da0551b7c6"
migrations_dir = "control-migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "fhg-command-photos"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://power-log-command.pages.dev"
SESSION_TTL_HOURS = "12"
# Not secret -- the account ID and this Worker's own D1 database ID, needed
# so the admin stats endpoint can query Cloudflare's API about itself.
CLOUDFLARE_ACCOUNT_ID = "c0f148161abb7df271064bb6f37f7227"
D1_DATABASE_ID = "96ae85a7-61f5-493e-847b-51a17aa39465"
GITHUB_REPO_URL = "https://github.com/thegreennite/Maintenence-Command"
# GHL_API_KEY is a Worker secret, not a var. Location/base aren't secret.
GHL_API_BASE = "https://services.leadconnectorhq.com"
GHL_LOCATION_ID = "B3DTv8qZBapYs1m8Rcv2"
PUBLIC_APP_URL = "https://power-log-command.pages.dev"
# Copied on every Friday report in addition to the Operations Managers.
# Comma-separated; remove an address here to stop its copy.
WEEKLY_REPORT_EXTRA_EMAILS = "lucas.garcia.gla@gmail.com"

[observability]
enabled = true

[triggers]
# 05:15 UTC is just after midnight in Toronto in both EST (00:15) and EDT
# (01:15) -- always after the calendar day has actually turned over
# locally, regardless of DST, so "end of day" locking matches the same
# Toronto-local date the rest of the app uses (see today() in
# worker/inspections.js).
#
# 21:00 and 22:00 UTC both fire every day: 5 PM Toronto is 21:00 UTC in
# summer (EDT) and 22:00 UTC in winter (EST), and a fixed UTC cron can't
# follow daylight saving. scheduled() checks it is genuinely Friday 5 PM
# in Toronto before sending the weekly report, so exactly one of the two
# ever sends it.
crons = ["15 5 * * *", "0 21 * * *", "0 22 * * *"]
