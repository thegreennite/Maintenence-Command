<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 480 380" fill="none">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a9183"/><stop offset=".3" stop-color="#1f5a50"/><stop offset="1" stop-color="#0a2622"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f8d86"/><stop offset=".45" stop-color="#e6efec"/><stop offset="1" stop-color="#5d7a73"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ff9a3c"/><stop offset="1" stop-color="#b8321b"/></radialGradient>
</defs>
<style>
 .steam{animation:steam 3.6s ease-out infinite;opacity:0}.s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
 @keyframes steam{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.7}100%{transform:translate(8px,-62px) scale(1.7);opacity:0}}
 .needle{transform-origin:center;transform-box:fill-box;animation:sway 4.5s ease-in-out infinite alternate}.n2{animation-delay:-2s;animation-duration:5.5s}
 @keyframes sway{from{transform:rotate(-22deg)}to{transform:rotate(26deg)}}
 .flame{animation:flick .35s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
 @keyframes flick{from{opacity:.75;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
 .flow{stroke-dasharray:3 22;animation:flow 1.6s linear infinite}.flow2{animation-direction:reverse}
 @keyframes flow{to{stroke-dashoffset:-50}}
 .led{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
 .fan{transform-origin:center;transform-box:fill-box;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<ellipse cx="250" cy="310" rx="205" ry="14" fill="#000" opacity=".38"/>
<!-- supply (red) and return (teal) pipes -->
<path d="M392 165H440V78H480" stroke="#7d2a22" stroke-width="20" stroke-linecap="round"/><path d="M392 165H440V78H480" stroke="#e0564a" stroke-width="14" stroke-linecap="round"/><path class="flow" d="M392 165H440V78H480" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
<path d="M392 240H452V292H480" stroke="#144f49" stroke-width="20" stroke-linecap="round"/><path d="M392 240H452V292H480" stroke="#36a79b" stroke-width="14" stroke-linecap="round"/><path class="flow flow2" d="M392 240H452V292H480" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
<rect x="428" y="140" width="24" height="9" rx="2" fill="#9db7b0"/><rect x="428" y="170" width="24" height="9" rx="2" fill="#9db7b0"/>
<!-- skid and legs -->
<rect x="64" y="284" width="344" height="16" rx="3" fill="#12302b"/><rect x="104" y="264" width="20" height="24" fill="#0d2420"/><rect x="354" y="264" width="20" height="24" fill="#0d2420"/>
<!-- shell -->
<rect x="95" y="118" width="300" height="156" rx="70" fill="url(#shell)"/>
<rect x="116" y="128" width="262" height="12" rx="6" fill="#fff" opacity=".13"/>
<rect x="192" y="118" width="10" height="156" fill="#07201c" opacity=".5"/><rect x="292" y="118" width="10" height="156" fill="#07201c" opacity=".5"/>
<!-- front door -->
<rect x="80" y="148" width="30" height="96" rx="7" fill="url(#metal)"/>
<circle cx="95" cy="160" r="3.6" fill="#51706a"/><circle cx="95" cy="196" r="3.6" fill="#51706a"/><circle cx="95" cy="232" r="3.6" fill="#51706a"/>
<!-- burner + gas train -->
<rect x="22" y="164" width="64" height="64" rx="11" fill="#243a37" stroke="#5d7a73" stroke-width="2"/>
<circle cx="54" cy="146" r="25" fill="#2d4a45" stroke="#6b8a83" stroke-width="2.5"/><circle cx="54" cy="146" r="14" fill="#0e2220"/>
<g class="fan"><path d="M54 134v24M42 146h24M45 137l18 18M63 137L45 155" stroke="#9fc0b8" stroke-width="2.2" stroke-linecap="round"/></g>
<circle cx="60" cy="197" r="12" fill="#0a1a18" stroke="#8aa8a1" stroke-width="2.5"/><circle class="flame" cx="60" cy="197" r="8" fill="url(#glow)"/>
<rect x="38" y="228" width="14" height="36" fill="#e5c13b"/><rect x="38" y="256" width="96" height="14" rx="3" fill="#e5c13b"/><rect x="38" y="256" width="96" height="4" fill="#fff" opacity=".35"/>
<rect x="76" y="244" width="8" height="16" rx="2" fill="#d33b30"/><circle cx="80" cy="241" r="7" fill="#d33b30"/>
<!-- stack + steam -->
<rect x="316" y="36" width="34" height="88" fill="url(#metal)"/><rect x="309" y="108" width="48" height="12" rx="3" fill="#8fa9a2"/><rect x="311" y="29" width="44" height="9" rx="3" fill="#9db7b0"/>
<circle class="steam" cx="333" cy="22" r="9" fill="#e8f1ee"/><circle class="steam s2" cx="336" cy="22" r="9" fill="#e8f1ee"/><circle class="steam s3" cx="330" cy="22" r="9" fill="#e8f1ee"/>
<!-- gauges -->
<rect x="230" y="116" width="8" height="12" fill="#6b8a83"/><circle cx="234" cy="98" r="26" fill="#1b2528"/><circle cx="234" cy="98" r="21" fill="#f1f5f2"/>
<path d="M219 112A21 21 0 0 1 211 96" stroke="#3b8f73" stroke-width="4"/><path d="M257 96A21 21 0 0 1 249 112" stroke="#d84b3e" stroke-width="4"/>
<g class="needle"><path d="M234 98V80" stroke="#d33b30" stroke-width="2.6" stroke-linecap="round"/></g><circle cx="234" cy="98" r="3.5" fill="#1b2528"/>
<rect x="160" y="124" width="8" height="10" fill="#6b8a83"/><circle cx="164" cy="110" r="20" fill="#1b2528"/><circle cx="164" cy="110" r="15.5" fill="#f1f5f2"/>
<path d="M153 120A15 15 0 0 1 149 108" stroke="#3b8f73" stroke-width="3.5"/>
<g class="needle n2"><path d="M164 110V97" stroke="#d33b30" stroke-width="2.2" stroke-linecap="round"/></g><circle cx="164" cy="110" r="3" fill="#1b2528"/>
<!-- control panel -->
<rect x="142" y="186" width="94" height="58" rx="9" fill="#0b2420" stroke="#5d7a73" stroke-width="2"/>
<rect x="152" y="196" width="74" height="26" rx="5" fill="#06100e"/><text x="160" y="216" fill="#8cf0b0" font-family="ui-monospace,Menlo,monospace" font-size="19" font-weight="700">182°F</text>
<circle class="led" cx="160" cy="234" r="4" fill="#dceb61"/><circle cx="178" cy="234" r="4" fill="#ff9a3c"/><circle cx="196" cy="234" r="4" fill="#4fc58b"/>
</svg>
