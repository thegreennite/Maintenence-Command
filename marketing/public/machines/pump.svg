<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
<defs>
 <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa89a"/><stop offset=".35" stop-color="#22695d"/><stop offset="1" stop-color="#0b2a25"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f8d86"/><stop offset=".45" stop-color="#e6efec"/><stop offset="1" stop-color="#5d7a73"/></linearGradient>
 <radialGradient id="volute" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#3d8f84"/><stop offset="1" stop-color="#103a35"/></radialGradient>
</defs>
<style>
 .flow{stroke-dasharray:3 22;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-50}}
 .spin{transform-origin:center;transform-box:fill-box;animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
 .needle{transform-origin:center;transform-box:fill-box;animation:sway 3.8s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(20deg)}}
 .led{animation:blink 1.2s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
 .vib{animation:vib .12s linear infinite alternate}@keyframes vib{from{transform:translateY(0)}to{transform:translateY(.8px)}}
</style>
<ellipse cx="255" cy="312" rx="215" ry="13" fill="#000" opacity=".38"/>
<!-- discharge pipe (up) and suction pipe (right) -->
<path d="M352 150V54H300" stroke="#144f49" stroke-width="22" stroke-linecap="round"/><path d="M352 150V54H300" stroke="#36a79b" stroke-width="16" stroke-linecap="round"/><path class="flow" d="M352 150V54H300" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
<rect x="340" y="140" width="24" height="9" rx="2" fill="#9db7b0"/><rect x="292" y="40" width="9" height="28" rx="2" fill="#9db7b0"/>
<path d="M480 236H404" stroke="#7d2a22" stroke-width="22" stroke-linecap="round"/><path d="M480 236H404" stroke="#e0564a" stroke-width="16" stroke-linecap="round"/><path class="flow" d="M480 236H404" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round" style="animation-direction:reverse"/>
<rect x="402" y="222" width="9" height="28" rx="2" fill="#9db7b0"/>
<!-- base plate -->
<rect x="50" y="282" width="380" height="18" rx="3" fill="#12302b"/><rect x="62" y="262" width="26" height="22" fill="#0d2420"/><rect x="190" y="262" width="26" height="22" fill="#0d2420"/><rect x="316" y="266" width="62" height="20" fill="#0d2420"/>
<g class="vib">
<!-- motor with fins -->
<rect x="60" y="168" width="196" height="100" rx="26" fill="url(#motor)"/>
<g stroke="#07201c" stroke-width="3" opacity=".55"><path d="M96 168v100M116 168v100M136 168v100M156 168v100M176 168v100M196 168v100M216 168v100"/></g>
<rect x="72" y="178" width="170" height="10" rx="5" fill="#fff" opacity=".13"/>
<rect x="42" y="190" width="30" height="56" rx="10" fill="#294d47" stroke="#6b8a83" stroke-width="2"/>
<rect x="124" y="148" width="52" height="24" rx="5" fill="#173d37" stroke="#6b8a83" stroke-width="2"/><circle cx="150" cy="160" r="4" fill="#dceb61" class="led"/>
<!-- coupling guard -->
<rect x="254" y="190" width="52" height="64" rx="8" fill="url(#metal)"/><path d="M262 205h36M262 222h36M262 239h36" stroke="#5d7a73" stroke-width="3" opacity=".6"/>
<!-- volute casing -->
<circle cx="352" cy="228" r="68" fill="url(#volute)" stroke="#1d5e54" stroke-width="3"/>
<circle cx="352" cy="228" r="54" fill="none" stroke="#7fb8ad" stroke-width="2" stroke-dasharray="4 7" opacity=".7"/>
<circle cx="352" cy="228" r="40" fill="#cfe0da"/><circle cx="352" cy="228" r="40" fill="none" stroke="#5d7a73" stroke-width="3"/>
<g class="spin"><path d="M352 200v56M324 228h56M332 208l40 40M372 208l-40 40" stroke="#6f8d86" stroke-width="5" stroke-linecap="round"/></g>
<circle cx="352" cy="228" r="9" fill="#1b2528"/>
<g fill="#0d2420"><circle cx="352" cy="170" r="4"/><circle cx="410" cy="228" r="4"/><circle cx="352" cy="286" r="4"/><circle cx="294" cy="228" r="4"/></g>
</g>
<!-- discharge gauge -->
<rect x="364" y="112" width="7" height="14" fill="#6b8a83"/><circle cx="368" cy="94" r="25" fill="#1b2528"/><circle cx="368" cy="94" r="20" fill="#f1f5f2"/>
<path d="M354 108A20 20 0 0 1 348 92" stroke="#3b8f73" stroke-width="4"/><path d="M388 92A20 20 0 0 1 382 108" stroke="#d84b3e" stroke-width="4"/>
<g class="needle"><path d="M368 94V77" stroke="#d33b30" stroke-width="2.6" stroke-linecap="round"/></g><circle cx="368" cy="94" r="3.4" fill="#1b2528"/>
</svg>
