<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
<defs>
 <linearGradient id="motor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b5249"/><stop offset=".4" stop-color="#58a698"/><stop offset="1" stop-color="#0c2d28"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8aa8a1"/><stop offset=".45" stop-color="#eef4f1"/><stop offset="1" stop-color="#6b8a83"/></linearGradient>
 <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a5c54"/><stop offset="1" stop-color="#0d2b26"/></linearGradient>
</defs>
<style>
 .flow{stroke-dasharray:3 22;animation:flow 1.5s linear infinite}@keyframes flow{to{stroke-dashoffset:-50}}
 .led{animation:blink 1.3s steps(2) infinite}.l2{animation-delay:.4s}.l3{animation-delay:.8s}@keyframes blink{50%{opacity:.2}}
 .needle{transform-origin:center;transform-box:fill-box;animation:sway 4s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
 .fan{transform-origin:center;transform-box:fill-box;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<ellipse cx="240" cy="312" rx="215" ry="13" fill="#000" opacity=".38"/>
<!-- common manifolds -->
<rect x="30" y="268" width="300" height="22" rx="6" fill="#144f49"/><rect x="30" y="268" width="300" height="8" rx="4" fill="#36a79b"/><path class="flow" d="M34 279H326" stroke="#fff" stroke-opacity=".75" stroke-width="3"/>
<rect x="30" y="84" width="300" height="20" rx="6" fill="#7d2a22"/><rect x="30" y="84" width="300" height="7" rx="3" fill="#e0564a"/><path class="flow" d="M34 94H326" stroke="#fff" stroke-opacity=".75" stroke-width="3" style="animation-direction:reverse"/>
<rect x="16" y="262" width="14" height="34" rx="3" fill="#9db7b0"/><rect x="16" y="78" width="14" height="34" rx="3" fill="#9db7b0"/>
<g>
 <!-- three vertical multistage pumps -->
 <g id="p1"><rect x="62" y="104" width="6" height="40" fill="#e0564a"/><rect x="62" y="248" width="6" height="22" fill="#36a79b"/>
  <rect x="42" y="132" width="46" height="62" rx="12" fill="url(#motor)"/><path d="M52 138v50M62 138v50M72 138v50M82 138v50" stroke="#07201c" stroke-width="2" opacity=".5"/>
  <circle cx="65" cy="128" r="11" fill="#294d47" stroke="#6b8a83" stroke-width="2"/><g class="fan"><path d="M65 120v16M57 128h16" stroke="#9fc0b8" stroke-width="2"/></g>
  <rect x="48" y="194" width="34" height="14" rx="3" fill="#9db7b0"/><rect x="50" y="208" width="30" height="52" rx="7" fill="url(#body)"/><path d="M52 222h26M52 236h26M52 250h26" stroke="#5d7a73" stroke-width="2.4"/><rect x="40" y="258" width="50" height="10" rx="3" fill="#12302b"/></g>
 <use href="#p1" x="96"/><use href="#p1" x="192"/>
</g>
<!-- control cabinet -->
<rect x="344" y="62" width="120" height="226" rx="12" fill="url(#cab)" stroke="#6b8a83" stroke-width="2.5"/>
<rect x="358" y="78" width="92" height="52" rx="7" fill="#06100e"/><text x="366" y="104" fill="#8cf0b0" font-family="ui-monospace,Menlo,monospace" font-size="21" font-weight="700">62 PSI</text><text x="366" y="121" fill="#5fb88a" font-family="ui-monospace,Menlo,monospace" font-size="9.5">3 PUMPS · AUTO</text>
<circle cx="372" cy="152" r="6" class="led" fill="#dceb61"/><circle cx="394" cy="152" r="6" class="led l2" fill="#4fc58b"/><circle cx="416" cy="152" r="6" class="led l3" fill="#ff9a3c"/>
<circle cx="404" cy="214" r="34" fill="#1b2528"/><circle cx="404" cy="214" r="28" fill="#f1f5f2"/>
<path d="M382 232A28 28 0 0 1 376 210" stroke="#3b8f73" stroke-width="5"/><path d="M432 210A28 28 0 0 1 426 232" stroke="#d84b3e" stroke-width="5"/>
<g class="needle"><path d="M404 214V190" stroke="#d33b30" stroke-width="3" stroke-linecap="round"/></g><circle cx="404" cy="214" r="4.5" fill="#1b2528"/>
<rect x="364" y="256" width="80" height="14" rx="4" fill="#0a1d1a" stroke="#4d6d66"/><rect x="372" y="260" width="30" height="6" rx="2" fill="#dceb61"/>
</svg>
