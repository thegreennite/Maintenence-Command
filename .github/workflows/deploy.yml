# Deploys Inspect Funnels from GitHub on every push to main, so nothing
# about shipping depends on Lucas's laptop. The app itself already runs
# entirely on Cloudflare (Pages + the fhg-command-api Worker + D1 + R2 +
# the Worker's own cron triggers); this just moves the deploy step there too.
#
# Only the main company database's migrations are applied here. The control
# database (power-log-command-control) was set up by hand and wrangler's
# migration table doesn't know about it, so applying its migrations from CI
# would try to re-run 0001_init on a live database.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
    steps:
      - name: Check deploy secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and VITE_GOOGLE_MAPS_API_KEY under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build web app
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply fhg-command-db --remote

      - name: Deploy API Worker
        run: npx wrangler deploy

      - name: Deploy web app
        run: npx wrangler pages deploy dist --project-name power-log-command --branch main --commit-dirty=true

      - name: Check the live API
        run: curl -fsS https://fhg-command-api.douglasmrgarcia.workers.dev/api/health
